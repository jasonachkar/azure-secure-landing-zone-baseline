name: Terraform Security Scan

on:
  pull_request:
    paths:
      - "azure-landing-zone/terraform/**"
      - "azure-landing-zone/policies/**"
  push:
    branches: [main]
    paths:
      - "azure-landing-zone/terraform/**"
      - "azure-landing-zone/policies/**"

permissions:
  contents: read

jobs:
  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: "~1.6" }
      - run: terraform fmt -check -recursive
        working-directory: azure-landing-zone/terraform

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: "~1.6" }
      - run: terraform init -backend=false
        working-directory: azure-landing-zone/terraform
      - run: terraform validate
        working-directory: azure-landing-zone/terraform

  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.3114.0
        with:
          directory: azure-landing-zone/terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false
      - uses: github/codeql-action/upload-sarif@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  tfsec:
    name: tfsec Scan
    runs-on: ubuntu-latest
    needs: validate
    env:
      TFSEC_VERSION: v1.28.14
      TFSEC_SHA256: a32d0799bbefababaa4fcd814da9f4d251cd932789590b99d1d5fcb89ace6f68
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install tfsec
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/tfsec"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location \
            "https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64" \
            --output "${install_dir}/tfsec"
          echo "${TFSEC_SHA256}  ${install_dir}/tfsec" | sha256sum --check --strict
          chmod +x "${install_dir}/tfsec"
          echo "${install_dir}" >> "${GITHUB_PATH}"
      - name: Generate tfsec SARIF
        run: tfsec --soft-fail --format sarif --out tfsec-results.sarif azure-landing-zone/terraform
      - uses: github/codeql-action/upload-sarif@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        if: always()
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec
      - name: Enforce tfsec findings
        run: tfsec azure-landing-zone/terraform

  trivy:
    name: Trivy Misconfiguration Scan
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate Trivy SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: azure-landing-zone/terraform
          skip-dirs: envs
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          version: v0.72.0
      - uses: github/codeql-action/upload-sarif@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Enforce Trivy findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: azure-landing-zone/terraform
          skip-dirs: envs
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          version: v0.72.0

  policy-lint:
    name: Validate Policy JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate JSON
        run: |
          for f in azure-landing-zone/policies/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "OK: $f" || exit 1
          done
