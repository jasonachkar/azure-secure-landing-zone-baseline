name: Terraform Security Scan

on:
  pull_request:
    paths:
      - "azure-landing-zone/terraform/**"
      - "azure-landing-zone/policies/**"
  push:
    branches: [main]
    paths:
      - "azure-landing-zone/terraform/**"
      - "azure-landing-zone/policies/**"

permissions:
  contents: read
  security-events: write

jobs:
  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.6" }
      - run: terraform fmt -check -recursive
        working-directory: azure-landing-zone/terraform

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.6" }
      - run: terraform init -backend=false
        working-directory: azure-landing-zone/terraform
      - run: terraform validate
        working-directory: azure-landing-zone/terraform

  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: azure-landing-zone/terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  tfsec:
    name: tfsec Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-sarif-action@v1
        with:
          sarif_file: tfsec-results.sarif
          working_directory: azure-landing-zone/terraform
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

  trivy:
    name: Trivy Misconfiguration Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: azure-landing-zone/terraform
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  policy-lint:
    name: Validate Policy JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          for f in azure-landing-zone/policies/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "OK: $f" || exit 1
          done
